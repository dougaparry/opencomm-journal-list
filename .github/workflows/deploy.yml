# Refreshes the snapshot from the Google Sheet and deploys the site to GitHub Pages.
# On scheduled and manual runs, the snapshot is also committed to main when the sheet
# has changed, or at least every 14 days. Those regular commits keep the repository
# active, so GitHub does not pause the daily schedule (it does so after 60 days
# without activity).
name: Update snapshot and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write # to commit the snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/configure-pages@v6

      # If the sheet cannot be fetched, the committed snapshot is deployed instead.
      - name: Fetch the sheet and regenerate the snapshot
        id: fetch
        run: node scripts/fetch-sheet.mjs
        continue-on-error: true

      - name: Commit the snapshot if the sheet changed or 14 days have passed
        if: steps.fetch.outcome == 'success' && github.event_name != 'push'
        run: |
          changed=false
          if ! diff -q <(git show HEAD:data/journals.json | jq 'del(.fetchedAt)') <(jq 'del(.fetchedAt)' data/journals.json) > /dev/null; then
            changed=true
          fi
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$changed" = true ] || [ "$days" -ge 14 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html data/journals.json sitemap.xml
            git commit -m 'Update snapshot from the sheet'
            git push
          else
            echo "No changes in the sheet and last commit was $days days ago; nothing to commit."
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js og-image.png robots.txt sitemap.xml .nojekyll data _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
