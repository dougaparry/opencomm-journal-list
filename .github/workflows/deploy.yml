# Refreshes the snapshot from the Google Sheet and deploys the site to GitHub Pages.
# Snapshot updates are deployed directly and never committed to main.
name: Update snapshot and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/configure-pages@v6

      # If the sheet cannot be fetched, the committed snapshot is deployed instead.
      - name: Fetch the sheet and regenerate the snapshot
        run: node scripts/fetch-sheet.mjs
        continue-on-error: true

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js og-image.png robots.txt sitemap.xml .nojekyll data _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # keeps .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
